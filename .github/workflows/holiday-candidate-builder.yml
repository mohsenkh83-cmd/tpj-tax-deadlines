name: TPJ Holiday Candidate Builder

on:
  workflow_dispatch:
  schedule:
    - cron: "45 4 * * 1"

permissions:
  contents: write
  issues: write

concurrency:
  group: tpj-holiday-candidate
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pypdf

      - name: Build holiday candidate from official PDF
        run: python holiday-candidate-builder.py

      - name: Detect candidate changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- holidays-candidate.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save candidate
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -e
          git config user.name "tpj-calendar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add holidays-candidate.json
          git commit -m "Update holiday candidate from official calendar"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done

          exit 1

      - name: Create review issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          YEAR=$(python -c "import json; print(json.load(open('holidays-candidate.json'))['year'])")
          COUNT=$(python -c "import json; print(len(json.load(open('holidays-candidate.json'))['candidates']))")
          gh issue create \
            --title "بررسی تعطیلات پیشنهادی سال ${YEAR} - TPJ" \
            --body "فایل holidays-candidate.json به‌روزرسانی شد و ${COUNT} مورد پیشنهادی دارد. لطفاً قبل از انتقال به holidays.json بررسی و تأیید شود."
