name: TPJ Official Calendar Check

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 1"

permissions:
  contents: write
  issues: write

concurrency:
  group: tpj-official-calendar
  cancel-in-progress: false

jobs:
  check-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check official calendar source
        run: python calendar-official-sync.py

      - name: Create issue for a newly published official calendar
        if: ${{ hashFiles('calendar-new-year.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "تقویم رسمی سال جدید منتشر شد - TPJ" \
            --body-file calendar-new-year.md

      - name: Save official calendar source index
        shell: bash
        run: |
          set -e

          git config user.name "tpj-calendar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add calendar-sources.json

          if git diff --cached --quiet; then
            echo "No source-index changes."
            exit 0
          fi

          git commit -m "Update official calendar sources"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done

          exit 1
