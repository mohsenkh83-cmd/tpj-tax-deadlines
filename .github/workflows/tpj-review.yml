name: TPJ review queue and notifications
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: tpj-review-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect notices for review only
        run: python monitor.py
      - name: Save review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'TPJ: refresh pending review queue'
            git push origin HEAD:main
          fi
      - name: Notify owner of new pending reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python notify-review.py
