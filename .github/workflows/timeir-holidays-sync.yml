name: TPJ Time.ir Holidays Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: write

concurrency:
  group: tpj-timeir-holidays
  cancel-in-progress: false

jobs:
  sync-holidays:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm install puppeteer@24
          pip install jdatetime

      - name: Get current Jalali year
        shell: bash
        run: |
          python - <<'PY'
          import os, jdatetime
          y = jdatetime.date.today().year
          print("Current Jalali year:", y)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CURRENT_JALALI_YEAR={y}\n")
          PY

      - name: Sync official holidays from Time.ir
        run: node timeir-holidays-sync.js

      - name: Save holidays.json
        shell: bash
        run: |
          set -e
          git config user.name "tpj-timeir-bot"
          git config user.email "actions@users.noreply.github.com"

          git add holidays.json

          if git diff --cached --quiet; then
            echo "No holiday changes."
            exit 0
          fi

          git commit -m "Sync holidays from Time.ir"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done

          exit 1

      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: timeir-debug
          path: |
            timeir-debug-*.html
            timeir-debug-*.png
          if-no-files-found: ignore
