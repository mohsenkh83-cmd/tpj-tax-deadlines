name: TPJ Tax Updates Check

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write
  issues: write

jobs:
  check-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check official channels
        run: python monitor.py

      - name: Create GitHub issue when a new relevant notice is found
        if: ${{ hashFiles('alerts-new.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "هشدار جدید مواعید مالیاتی/بیمه‌ای TPJ" \
            --body-file alerts-new.md

      - name: Save monitor state
        run: |
          git config user.name "tpj-deadline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add monitor-state.json
          git diff --cached --quiet || git commit -m "Update TPJ monitor state"
          git push
